<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cocona 帳票アプリ</title>
<style>
:root{--bg:#F3F4F6;--card:#FFFFFF;--ink:#1C2129;--muted:#5B6371;--line:#D5D9E0;--accent:#23457F}
@media (prefers-color-scheme: dark){:root{color-scheme:dark;--bg:#101318;--card:#181C24;--ink:#E6E9EF;--muted:#949CAB;--line:#2A303B;--accent:#8FB0F0}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.6;padding:40px 20px}
main{max-width:760px;margin:0 auto;display:grid;gap:20px}
h1{margin:0;font-size:22px}
p{margin:0;color:var(--muted)}
.list{display:grid;gap:12px}
a.card{display:grid;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;color:inherit;text-decoration:none}
a.card:hover,a.card:focus-visible{border-color:var(--accent);outline:none}
a.card b{font-size:16px;color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>Cocona 日報・日計表 アプリ化</h1>
  <p>手書きの日報・日計表を GAS＋スプレッドシートの Web アプリにする計画のデザイン案です。数字はサンプルで、入力すると合計・過不足がその場で計算されます。</p>
  <div class="list">
    <a class="card" href="design/#a"><b>A 帳票そのまま</b><span>紙の様式をそのまま画面に。日報と日計表を2枚並べ、押印欄もクリックで押せる。</span></a>
    <a class="card" href="design/#b"><b>B 入力ガイド＋検算</b><span>項目ごとのカードで入力し、右側の検算パネルで売上計・現金在高・過不足を常に確認。</span></a>
    <a class="card" href="design/#c"><b>C 表計算ライク</b><span>1画面に全項目。月カレンダーで各日の状態が分かり、Enterで次の欄へ進める。</span></a>
  </div>
</main>
</body>
</html>
